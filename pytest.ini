[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    gpu: requires a CUDA GPU (skipped when torch.cuda.is_available() is False)
    slow: long-running end-to-end test (>30s); skipped unless -m slow is passed
    trellis2: requires TRELLIS.2 models loaded; skipped if TRELLIS.2 not importable
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:trimesh.*
